[project]
name = "myvllm"
version = "0.1.0"
description = "Qwen hybrid inference and DFlash2 speculative decoding research on Mini-vLLM"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "transformers==4.57.3",
    "torch==2.9.1",
    "triton==3.5.1; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "xxhash",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]
oracle = [
    "vllm>=0.15.0; sys_platform != 'win32'",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "tests"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
]
